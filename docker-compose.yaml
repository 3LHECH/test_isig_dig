version: '3.8'

services:

  backend:
    build:
      context: ./test-.net
      dockerfile: Dockerfile
    container_name: isig_backend
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=IsigDigDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;


  frontend:
    build:
      context: ./test_angular
      dockerfile: Dockerfile
    container_name: isig_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend